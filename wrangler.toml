name = "goodday-tracker"
main = "src/index.ts"
compatibility_date = "2026-11-20"

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "goodday-tracker"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
